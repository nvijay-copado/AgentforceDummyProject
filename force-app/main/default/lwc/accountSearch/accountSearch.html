<template>
    <lightning-card title="Account Search" icon-name="standard:account">
        <div class="slds-p-horizontal_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col"><lightning-input label="Name" value={name} onchange={handleName}></lightning-input></div>
                <div class="slds-col"><lightning-input label="Industry" value={industry} onchange={handleIndustry}></lightning-input></div>
                <div class="slds-col"><lightning-input label="Region (Billing State)" value={region} onchange={handleRegion}></lightning-input></div>
            </div>
            <template if:true={isLoading}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
            <template if:true={error}><p class="slds-text-color_error slds-m-top_small">{error}</p></template>
            <template if:true={hasRecords}>
                <lightning-datatable key-field="Id" data={records} columns={columns} sorted-by={sortedBy}
                    sorted-direction={sortedDirection} onsort={handleSort} hide-checkbox-column></lightning-datatable>
                <div class="slds-m-top_small slds-grid slds-grid_align-spread">
                    <lightning-button label="Previous" onclick={handlePrev} disabled={isFirstPage}></lightning-button>
                    <span>Page {pageNumber} of {totalPages} ({totalCount} results)</span>
                    <lightning-button label="Next" onclick={handleNext} disabled={isLastPage}></lightning-button>
                </div>
            </template>
            <template if:true={showEmpty}>
                <p class="slds-m-top_small">No accounts match your search. Try different filters.</p>
            </template>
        </div>
    </lightning-card>
</template>
