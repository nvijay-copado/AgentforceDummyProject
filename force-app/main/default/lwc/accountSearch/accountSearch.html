<template>
    <lightning-card title="Account Search" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input label="Name" value={name} onchange={handleName}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input label="Industry" value={industry} onchange={handleIndustry}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input label="Region (Billing State)" value={region} onchange={handleRegion}></lightning-input>
                </div>
            </div>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error slds-var-m-top_small">{error}</p>
            </template>
            <template if:true={hasRecords}>
                <lightning-datatable key-field="Id" data={records} columns={columns}
                    sorted-by={sortedBy} sorted-direction={sortedDirection}
                    onsort={handleSort} hide-checkbox-column></lightning-datatable>
                <div class="slds-var-m-top_small">
                    <lightning-button label="Previous" onclick={handlePrev} disabled={isFirstPage}></lightning-button>
                    <span class="slds-var-m-horizontal_small">Page {pageNumber} of {totalPages} ({totalCount} results)</span>
                    <lightning-button label="Next" onclick={handleNext} disabled={isLastPage}></lightning-button>
                </div>
            </template>
            <template if:true={showEmpty}>
                <p class="slds-var-m-top_small">No accounts match your search. Try different filters.</p>
            </template>
        </div>
    </lightning-card>
</template>
